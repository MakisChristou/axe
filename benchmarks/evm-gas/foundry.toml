# Foundry project for the EVM gas benchmark (GasHarness.t.sol). Self-contained:
# the harness declares its own interfaces + cheatcode interface, so no lib/
# (forge-std) is needed. It forks Ethereum mainnet and MUST run with --isolate
# (see `axe bench evm-gas`, or `MAINNET_RPC_URL=<url> forge test --mc GasHarness
# --isolate -vv`).
[profile.default]
src = "test"
test = "test"
out = "out"
libs = []
solc = "0.8.23"
optimizer = true
optimizer_runs = 200

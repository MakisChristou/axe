name: Cron — Testnet Routes (twice daily)

# Twice-daily testnet smoke test of the wired ITS route fleet.
# Calls `test-routes.yml` as a reusable workflow. The child run
# produces a ✓ / ✗ step-summary table and fails red on any failed route;
# the parent cron run shows the same red status in the Actions tab (no extra
# Slack/email wiring — matches the notification model used elsewhere in the
# axelar org).
#
# Cron expressions are UTC. 00:00 + 12:00 UTC = midnight + midday daily.
#
# GMP is deliberately NOT included here — same shape as the mainnet cron, so
# the two networks stay symmetric. The `test-routes.yml` workflow
# still supports `workflow_dispatch` with `protocol: gmp` for manual / ad-hoc
# runs, but it isn't fired on schedule.

on:
  schedule:
    - cron: '0 0,12 * * *'
  # Manual trigger for ad-hoc reruns without changing the cron schedule.
  workflow_dispatch: {}

jobs:
  # Real express-executor check: originates an aUSDC transfer through the
  # allowlisted AxelarApp proxy and fails red unless the gmp-express-executor
  # service fronts it and is reimbursed the exact amount. This exercises the
  # live service, not a stand-in executor.
  testnet-express:
    uses: ./.github/workflows/test-express-execution.yml
    with:
      mode: originate
      network: testnet
      source_chain: avalanche
      destination_chain: ethereum-sepolia
      # 1 base unit of axlUSDC (0.000001 USDC) - the express registry caps
      # have min: 0, so the smallest nonzero amount exercises the exact same
      # front-and-reimburse path with nothing at stake.
      amount: '1'
    secrets: inherit

  testnet-its:
    uses: ./.github/workflows/test-routes.yml
    with:
      network: testnet
      protocol: its
    # `inherit` is required so the child workflow can read the per-chain RPC
    # overrides and the EVM/Solana/Sui/XRPL/Stellar private keys it needs.
    secrets: inherit

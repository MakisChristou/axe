name: Cron — Mainnet Routes (twice daily)

# Twice-daily mainnet smoke test of the wired ITS route fleet.
# Calls `test-routes.yml` as a reusable workflow. The child run
# produces a ✓ / ✗ step-summary table and fails red on any failed route;
# the parent cron run shows the same red status in the Actions tab (no extra
# Slack/email wiring — matches the notification model used elsewhere in the
# axelar org).
#
# Cron expressions are UTC. 00:00 + 12:00 UTC = midnight + midday daily.
#
# GMP is deliberately NOT included here — the `test-routes.yml`
# workflow still supports `workflow_dispatch` with `protocol: gmp` for
# manual / ad-hoc runs, but it isn't fired on schedule.

on:
  schedule:
    - cron: '0 0,12 * * *'
  # Manual trigger for ad-hoc reruns without changing the cron schedule.
  workflow_dispatch: {}

jobs:
  # Real express-executor check against the live service. Originates a small
  # axlUSDC transfer through the allowlisted AxelarApp proxy and fails red
  # unless the executor fronts it and is reimbursed the exact amount.
  #
  # COST: real funds. Gas is spent per run; the axlUSDC itself is sent to our
  # own address on the destination, so it is not lost but it does migrate
  # source -> destination. Top the source wallet up (or add a reverse-direction
  # job) when avalanche axlUSDC runs low.
  mainnet-express:
    uses: ./.github/workflows/test-express-execution.yml
    with:
      mode: originate
      network: mainnet
      source_chain: avalanche
      destination_chain: base
      amount: '10000'
      gas_value: '60000000000000000'
    secrets: inherit

  mainnet-its:
    uses: ./.github/workflows/test-routes.yml
    with:
      network: mainnet
      protocol: its
    # `inherit` is required so the child workflow can read the per-chain RPC
    # overrides and the EVM/Solana/Sui/XRPL/Stellar private keys it needs.
    secrets: inherit
